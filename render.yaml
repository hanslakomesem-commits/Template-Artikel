# Render Blueprint: 1 hosting untuk frontend + backend.
# Tidak membutuhkan API key; frontend terhubung ke origin yang sama.
services:
  - type: web
    name: zainnet-artikel-engine
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
