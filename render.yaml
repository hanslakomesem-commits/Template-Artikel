services:
  - type: web
    name: zainnet-word-converter
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://hanslakomesem-commits.github.io
      - key: LIBREOFFICE_TIMEOUT
        value: "120"
      - key: MAX_DOCX_MB
        value: "25"
